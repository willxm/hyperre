name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.18", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz (short)
        if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz=FuzzMatchesRegexp -fuzztime=60s .
      - name: gofmt
        if: matrix.go == 'stable'
        run: test -z "$(gofmt -l .)"
